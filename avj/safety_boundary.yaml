not_do:
  - 不提供实盘交易信号或投资建议
  - 不保证策略收益
  - 不建议未经验证的策略投入实盘
human_review_required:
  - AI生成的策略需要用户手动review后再使用（/validate-and-run 接口要求 confirmed=True）
  - 回测结果不能直接等同于实盘表现
data_handling:
  - 不存储用户交易数据或投资组合
  - 腾讯行情API为公开行情数据
  - DeepSeek API Key存储在.env文件（权限600）
consent_or_authorization:
  - 策略保存需要用户主动操作
  - 不自动执行交易
risk_scenarios:
  - 风险1：AI生成策略含不切实际的收益承诺（通过prompt工程限制）
  - 风险2：因子计算使用未来数据（通过exec作用域分割+时间戳校验防护）
  - 风险3：DeepSeek API密钥泄露（通过.env权限600 + .gitignore防护）
audit_logs: false
fallback_plan: >
  数据源降级：腾讯API→Akshare→本地缓存。
  部署故障：systemd自动重启 + Docker回滚。
evidence:
  - E005
