claims:
  - id: C001
    claim: 28因子5维度量化引擎覆盖A股全市场，纯Python无第三方依赖。
    evidence: [E001, E005]
    verification:
      - 检查quant_engine.py中28个因子的实现
      - 检查是否依赖TA-Lib等第三方量化库
      - 随机抽取5只股票验证因子计算
    limitations:
      - 因子有效性未经长期实盘验证

  - id: C002
    claim: 自然语言→结构化策略的AI管道，降低量化投资编程门槛。
    evidence: [E002, E003]
    verification:
      - 用自然语言描述一个策略，检查输出的策略JSON结构
      - 检查生成的策略是否可在回测引擎中运行
    limitations:
      - 策略质量取决于DeepSeek API的表现
      - 输出策略需用户手动review

  - id: C003
    claim: 回测引擎内置未来穿越防护和Mock TA-Lib，结果可靠。
    evidence: [E004]
    verification:
      - 检查exec作用域分割代码
      - 检查未来穿越检测触发条件
      - 用已知策略验证回测结果是否合理
    limitations:
      - 回测不代表实盘表现
      - 尚未有模拟盘验证

  - id: C004
    claim: 已部署生产环境，6大功能页面完整可用。
    evidence: [E003, E006]
    verification:
      - 访问 http://122.51.110.50:8000 检查前端页面
      - 调用API验证单股分析/扫描/回测功能
    limitations:
      - 依赖腾讯行情API可用性
      - 部分功能仅对30只样本股票验证
